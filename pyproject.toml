[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-eval"
version = "0.0.0"
description = "Evaluation utilities for repeated-query long-video reuse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "openai>=1.0",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pillow>=10",
]
dev = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
