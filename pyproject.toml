[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-eval"
version = "0.1.0"
description = "Evaluation utilities for repeated-query long-video reuse"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Xin Liang" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "openai>=1.0",
  "Pillow>=10",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
  "pandas>=2.2",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.15",
]

[project.scripts]
reel-verify-results = "pestate.paper_results:main"
reel-release-audit = "pestate.release_audit:main"

[project.urls]
Homepage = "https://github.com/LiangXin1001/REEL-code"
Repository = "https://github.com/LiangXin1001/REEL-code"
Issues = "https://github.com/LiangXin1001/REEL-code/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/run_controlled_memory_policy_cgbench.py" = ["E402"]
"tests/test_public_cohort_builders.py" = ["E402"]
